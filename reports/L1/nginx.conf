worker_processes 1;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;

    ssl_certificate C:/Users/Iskander/Desktop/DevOps/L1/.runtime/nginx-1.31.8/conf/lab.crt;
    ssl_certificate_key C:/Users/Iskander/Desktop/DevOps/L1/.runtime/nginx-1.31.8/conf/lab.key;

    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
    limit_req_status 429;

    upstream miniapp {
        server 127.0.0.1:8001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:8002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 127.0.0.1:80 default_server;
        server_name _;
        return 404;
    }

    server {
        listen 127.0.0.1:80;
        server_name shop.test second.test;
        return 301 https://$host$request_uri;
    }

    server {
        listen 127.0.0.1:443 ssl default_server;
        server_name _;
        return 404;
    }

    server {
        listen 127.0.0.1:443 ssl;
        server_name shop.test;
        root C:/Users/Iskander/Desktop/DevOps/L0/miniapp/static;
        index index.html;
        error_page 404 /404.html;

        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://miniapp;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header Origin "";
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }

        location /static/ {
            alias C:/Users/Iskander/Desktop/DevOps/L0/miniapp/static/;
        }

        location /docs/ {
            alias C:/Users/Iskander/Desktop/DevOps/L0/miniapp/reports/L1/html/docs/;
            index index.html;
        }

        location ^~ /admin {
            auth_basic "Admin";
            auth_basic_user_file C:/Users/Iskander/Desktop/DevOps/L1/.runtime/nginx-1.31.8/conf/.htpasswd;
            root C:/Users/Iskander/Desktop/DevOps/L0/miniapp/reports/L1/html;
            try_files /admin.html =404;
        }

        location = /404.html {
            root C:/Users/Iskander/Desktop/DevOps/L0/miniapp/reports/L1/html;
            internal;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    server {
        listen 127.0.0.1:443 ssl;
        server_name second.test;
        root C:/Users/Iskander/Desktop/DevOps/L0/miniapp/reports/L1/html/second;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
