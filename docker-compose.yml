services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teploe_zerno}
      POSTGRES_USER: ${POSTGRES_USER:-teploe_zerno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teploe_zerno_dev_password}
    volumes:
      - miniapp_pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-teploe_zerno} -d $${POSTGRES_DB:-teploe_zerno}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.good
    image: miniapp:good
    environment:
      APP_MODE: compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-teploe_zerno}:${POSTGRES_PASSWORD:-teploe_zerno_dev_password}@db:5432/${POSTGRES_DB:-teploe_zerno}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  frontend:
    image: nginx:1.27.2-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./static:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net

volumes:
  miniapp_pgdata:
    name: miniapp_pgdata

networks:
  frontend_net:
    name: miniapp_frontend_net
  backend_net:
    name: miniapp_backend_net
